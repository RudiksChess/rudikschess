<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Rudik Rompich — Founder and applied mathematician">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#121A30"/>
    </linearGradient>
    <pattern id="board" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="45" height="45" fill="#FFFFFF"/>
      <rect x="45" y="45" width="45" height="45" fill="#FFFFFF"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.45" stop-color="#000"/>
      <stop offset="1" stop-color="#FFF"/>
    </linearGradient>
    <mask id="m">
      <rect width="1280" height="360" fill="url(#fade)"/>
    </mask>
    <clipPath id="r">
      <rect width="1280" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#board)" opacity="0.055" mask="url(#m)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="18" fill="none" stroke="#2A3350"/>

  <rect x="88" y="104" width="44" height="2" fill="#C8A96A"/>
  <text x="88" y="142" fill="#C8A96A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4.5">FOUNDER  ·  APPLIED MATHEMATICIAN</text>
  <text x="85" y="216" fill="#F5F6FA" font-family="Georgia, 'Times New Roman', Times, serif" font-size="68" letter-spacing="-0.5">Rudik Rompich</text>
  <text x="88" y="266" fill="#9AA6C0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Data systems built to survive scrutiny.</text>
</svg>
